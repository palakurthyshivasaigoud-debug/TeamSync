name: TeamSync CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ⚡ Ruff — Lint & Format Check
        run: ruff check .
        continue-on-error: false

      - name: 🔒 Bandit — Security Vulnerability Scan
        run: bandit -r backend -ll -ii --exclude backend/__pycache__
        continue-on-error: false

      - name: 🧪 Pytest — Run Test Suite
        run: |
          pytest tests/ -v --cov=backend --cov-report=term-missing --cov-fail-under=60
        env:
          FLASK_ENV: testing
          DATABASE_URL: sqlite:///test_teamsync.db

      - name: 📊 Upload Coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v3
        with:
          fail_ci_if_error: false

  security-check:
    name: Dependency Security
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install pip-audit
        run: pip install pip-audit

      - name: 🔍 Audit Dependencies for Vulnerabilities
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2022-42969
        continue-on-error: true
